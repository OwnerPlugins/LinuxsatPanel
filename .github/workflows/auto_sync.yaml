name: Auto-Sync Ciefp & Clean Icons

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Auto-Sync & Clean
        working-directory: ./usr/lib/enigma2/python/Plugins/Extensions/LinuxsatPanel
        run: python sync_ciefp.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-sync: Aggiornati plugin Ciefp e pulite icone"
          file_pattern: "usr/lib/enigma2/python/Plugins/Extensions/LinuxsatPanel/data/scripts.json usr/lib/enigma2/python/Plugins/Extensions/LinuxsatPanel/LSicons2/*.png"
